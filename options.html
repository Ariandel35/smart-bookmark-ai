<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="optionsPageTitle">Smart Bookmark AI - Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div class="topbar__row">
          <div>
            <h1 class="topbar__title" data-i18n="optionsMainTitle">Settings Center</h1>
          </div>

          <div class="topbar__actions topbar__actions--page">
            <span class="pill pill--accent" id="saveBadge" data-i18n="saveBadgeUnsaved">Unsaved</span>
            <button
              class="button button--primary button--compact"
              type="submit"
              form="settingsForm"
              data-i18n="saveButton"
            >
              Save
            </button>
            <button
              class="button button--ghost button--compact"
              type="button"
              id="resetButton"
              data-i18n="resetButton"
            >
              Reset
            </button>
            <button
              class="button button--ghost button--compact"
              type="button"
              id="privacyButton"
              data-i18n="privacyButton"
            >
              Privacy
            </button>
          </div>
        </div>
      </header>

      <section class="workspace">
        <aside class="sidebar panel">
            <div class="panel__inner">
              <div class="panel__heading">
                <div>
                  <p class="panel__eyebrow" data-i18n="navEyebrow">Navigation</p>
                  <h2 class="panel__title" data-i18n="navTitle">Settings Navigation</h2>
                </div>
              </div>

            <nav class="nav-list" data-i18n-aria-label="navTitle" aria-label="Settings Navigation">
              <button
                class="nav-button is-active"
                type="button"
                data-section-target="connection"
                aria-selected="true"
              >
                <span class="nav-button__title" data-i18n="navConnection">Connection</span>
              </button>
              <button
                class="nav-button"
                type="button"
                data-section-target="organize"
                aria-selected="false"
              >
                <span class="nav-button__title" data-i18n="navOrganize">Organization</span>
              </button>
              <button
                class="nav-button"
                type="button"
                data-section-target="automation"
                aria-selected="false"
              >
                <span class="nav-button__title" data-i18n="navAutomation">Automation</span>
              </button>
              <button
                class="nav-button"
                type="button"
                data-section-target="backup"
                aria-selected="false"
              >
                <span class="nav-button__title" data-i18n="navBackup">Backups</span>
              </button>
            </nav>
          </div>
        </aside>

        <section class="content-stack">
          <form id="settingsForm" class="form-grid">
            <section
              class="panel settings-section is-active"
              data-section-panel="connection"
            >
              <div class="panel__inner">
                <div class="panel__heading">
                  <div>
                    <h2 class="panel__title" data-i18n="connectionTitle">Connection Settings</h2>
                  </div>
                </div>

                <div class="form-grid">
                  <div class="field-grid">
                    <div class="field">
                      <label for="provider" data-i18n="labelProvider">API Provider</label>
                      <select id="provider" name="provider"></select>
                    </div>

                    <div class="field">
                      <label for="model" data-i18n="labelModel">Model Name</label>
                      <input
                        id="model"
                        name="model"
                        type="text"
                        data-i18n-placeholder="placeholderModel"
                        placeholder="e.g. gpt-4.1-mini"
                        spellcheck="false"
                      />
                    </div>
                  </div>

                  <div class="field">
                    <label for="baseUrl" data-i18n="labelBaseUrl">Base URL</label>
                    <input
                      id="baseUrl"
                      name="baseUrl"
                      type="url"
                      placeholder="https://api.openai.com/v1"
                      spellcheck="false"
                      inputmode="url"
                    />
                  </div>

                  <div class="field">
                    <label for="apiKey" data-i18n="labelApiKey">API Key</label>
                    <input
                      id="apiKey"
                      name="apiKey"
                      type="password"
                      data-i18n-placeholder="placeholderApiKey"
                      placeholder="Enter API key"
                      autocomplete="new-password"
                      spellcheck="false"
                    />
                  </div>

                  <div class="field field--inline-actions">
                    <div class="field__toolbar">
                      <button class="button button--secondary button--compact" type="button" id="testApiButton">
                        <span data-i18n="testApiButton">Test API</span>
                      </button>
                      <span class="status-text field__status" id="apiTestStatus" aria-live="polite" hidden></span>
                    </div>
                  </div>

                  <div class="field field--inline-actions">
                    <div class="field__toolbar">
                      <button class="button button--ghost button--compact" type="button" id="grantAccessButton">
                        <span data-i18n="hostAccessButton">Grant Site Access</span>
                      </button>
                      <span class="status-text field__status" id="hostAccessStatus" aria-live="polite"></span>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section class="panel settings-section" data-section-panel="organize" hidden>
              <div class="panel__inner">
                <div class="panel__heading">
                  <div>
                    <h2 class="panel__title" data-i18n="organizeTitle">Organization Rules</h2>
                  </div>
                </div>

                <div class="form-grid">
                  <div class="field">
                    <label for="batchSize" data-i18n="labelBatchSize">Batch Size</label>
                    <input
                      id="batchSize"
                      name="batchSize"
                      type="number"
                      min="5"
                      max="100"
                      step="1"
                      inputmode="numeric"
                      placeholder="50"
                    />
                  </div>

                  <div class="field field--full">
                    <div class="field__toolbar">
                      <label for="whitelistSearch" data-i18n="labelWhitelistDomains">Whitelist Websites</label>
                      <span class="field__status" id="whitelistSelectionStatus"></span>
                    </div>
                    <input
                      id="whitelistSearch"
                      name="whitelistSearch"
                      type="search"
                      data-i18n-placeholder="placeholderWhitelistSearch"
                      placeholder="Search websites"
                    />
                    <div class="whitelist-picker">
                      <div class="whitelist-picker__section">
                        <div class="whitelist-picker__label" data-i18n="whitelistSelectedTitle">Selected</div>
                        <div class="chip-list whitelist-picker__selected" id="whitelistSelected"></div>
                        <div class="empty-state hidden" id="whitelistSelectedEmpty" data-i18n="whitelistSelectedEmpty">
                          No selected websites
                        </div>
                      </div>

                      <div class="whitelist-picker__section">
                        <div class="whitelist-picker__label" data-i18n="whitelistAvailableTitle">Bookmark Websites</div>
                        <div class="whitelist-picker__list" id="whitelistDomainList"></div>
                      </div>
                    </div>
                    <input id="whitelistDomains" name="whitelistDomains" type="hidden" />
                  </div>

                  <div class="field">
                    <label for="protectedRootFolders" data-i18n="labelProtectedRootFolders">Protected Root Folders</label>
                    <textarea
                      id="protectedRootFolders"
                      name="protectedRootFolders"
                      data-i18n-placeholder="placeholderProtectedRootFolders"
                      placeholder="One root folder per line"
                    ></textarea>
                  </div>

                  <details class="advanced-block field--full">
                    <summary class="advanced-block__summary" data-i18n="advancedSettingsTitle">Advanced Settings</summary>
                    <div class="advanced-block__content">
                      <div class="field">
                        <label for="domainFolderRules" data-i18n="labelDomainFolderRules">Domain Folder Rules</label>
                        <textarea
                          id="domainFolderRules"
                          name="domainFolderRules"
                          data-i18n-placeholder="placeholderDomainFolderRules"
                          placeholder="example.com => Tools / Reading"
                        ></textarea>
                      </div>

                      <div class="field">
                        <label for="customPrompt" data-i18n="labelCustomPrompt">Custom Prompt</label>
                        <textarea
                          id="customPrompt"
                          name="customPrompt"
                          data-i18n-placeholder="placeholderPrompt"
                          placeholder="Enter custom prompt"
                        ></textarea>
                      </div>
                    </div>
                  </details>
                </div>
              </div>
            </section>

            <section class="panel settings-section" data-section-panel="automation" hidden>
              <div class="panel__inner">
                <div class="panel__heading">
                  <div>
                    <h2 class="panel__title" data-i18n="automationTitle">Automation</h2>
                  </div>
                </div>

                <div class="split-grid">
                  <div class="field">
                    <label for="autoOrganizeEnabled" data-i18n="labelAutoOrganizeEnabled">Auto Silent Organize</label>
                    <select id="autoOrganizeEnabled" name="autoOrganizeEnabled">
                      <option value="true" data-i18n="autoOrganizeOn">Enabled</option>
                      <option value="false" data-i18n="autoOrganizeOff">Disabled</option>
                    </select>
                  </div>

                  <div class="field">
                    <label for="autoOrganizeIntervalHours" data-i18n="labelAutoOrganizeInterval">Auto Organize Interval (hours)</label>
                    <input
                      id="autoOrganizeIntervalHours"
                      name="autoOrganizeIntervalHours"
                      type="number"
                      min="1"
                      max="168"
                      step="1"
                      inputmode="numeric"
                      placeholder="24"
                    />
                  </div>
                </div>
              </div>
            </section>

            <section class="panel settings-section" data-section-panel="backup" hidden>
              <div class="panel__inner">
                <div class="panel__heading">
                  <div>
                    <h2 class="panel__title" data-i18n="backupTitle">Backup Management</h2>
                  </div>
                  <span class="pill" id="backupStatusBadge" data-i18n="backupLoading">Loading</span>
                </div>

                <div class="form-grid">
                  <div class="backup-list" id="backupList">
                    <div class="empty-state" data-i18n="backupLoading">Loading</div>
                  </div>

                  <div class="actions">
                    <button class="button button--secondary button--compact" type="button" id="createBackupButton">
                      <span data-i18n="createBackupNow">Create Backup</span>
                    </button>
                  </div>
                </div>
              </div>
            </section>

          </form>
        </section>
      </section>
    </main>

    <script src="i18n.js"></script>
    <script src="providers.js"></script>
    <script src="options.js"></script>
  </body>
</html>
