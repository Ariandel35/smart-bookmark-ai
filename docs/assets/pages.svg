<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="28" fill="#F4F5F0"/>
  <rect x="36" y="36" width="1128" height="628" rx="26" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>

  <text x="74" y="100" fill="#131713" font-family="Arial, sans-serif" font-size="34" font-weight="700">Product overview</text>
  <text x="74" y="138" fill="#667065" font-family="Arial, sans-serif" font-size="20">Popup, settings center, and backup management shown as one consistent system.</text>

  <rect x="74" y="182" width="322" height="442" rx="24" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="438" y="182" width="334" height="442" rx="24" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="814" y="182" width="312" height="442" rx="24" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>

  <text x="106" y="226" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">POPUP</text>
  <text x="470" y="226" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">SETTINGS CENTER</text>
  <text x="846" y="226" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">BACKUP MANAGEMENT</text>

  <rect x="106" y="252" width="138" height="42" rx="16" fill="#1F6D53"/>
  <rect x="256" y="252" width="110" height="42" rx="16" fill="#EBF5F0"/>
  <text x="142" y="279" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">Organize</text>
  <text x="282" y="279" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">Backup</text>

  <rect x="106" y="320" width="260" height="10" rx="5" fill="#E9EEE6"/>
  <rect x="106" y="320" width="164" height="10" rx="5" fill="#1F6D53"/>

  <rect x="106" y="360" width="260" height="72" rx="18" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="106" y="450" width="260" height="72" rx="18" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="106" y="540" width="260" height="52" rx="18" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <text x="132" y="402" fill="#131713" font-family="Arial, sans-serif" font-size="22" font-weight="700">Overview</text>
  <text x="132" y="432" fill="#667065" font-family="Arial, sans-serif" font-size="18">Progress, status, and task summary.</text>
  <text x="132" y="492" fill="#131713" font-family="Arial, sans-serif" font-size="22" font-weight="700">Processed</text>
  <text x="132" y="522" fill="#667065" font-family="Arial, sans-serif" font-size="18">Category counts and deletion results.</text>
  <text x="132" y="572" fill="#131713" font-family="Arial, sans-serif" font-size="22" font-weight="700">Unprocessed</text>

  <rect x="470" y="252" width="270" height="56" rx="16" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="470" y="326" width="270" height="56" rx="16" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="470" y="400" width="270" height="110" rx="16" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="470" y="534" width="126" height="42" rx="14" fill="#EBF5F0"/>
  <rect x="610" y="534" width="130" height="42" rx="14" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <text x="496" y="286" fill="#131713" font-family="Arial, sans-serif" font-size="19" font-weight="700">Provider / Model / Base URL</text>
  <text x="496" y="360" fill="#131713" font-family="Arial, sans-serif" font-size="19" font-weight="700">API Key / Runtime access</text>
  <text x="496" y="438" fill="#131713" font-family="Arial, sans-serif" font-size="19" font-weight="700">Prompt / Whitelist / Batch size</text>
  <text x="496" y="468" fill="#667065" font-family="Arial, sans-serif" font-size="18">One settings center for connection,</text>
  <text x="496" y="494" fill="#667065" font-family="Arial, sans-serif" font-size="18">organization rules, automation,</text>
  <text x="496" y="520" fill="#667065" font-family="Arial, sans-serif" font-size="18">and backup recovery.</text>
  <text x="500" y="561" fill="#1F6D53" font-family="Arial, sans-serif" font-size="17" font-weight="700">Test API</text>
  <text x="640" y="561" fill="#131713" font-family="Arial, sans-serif" font-size="17" font-weight="700">Grant access</text>

  <rect x="846" y="252" width="248" height="84" rx="18" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="846" y="352" width="248" height="84" rx="18" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="846" y="452" width="248" height="84" rx="18" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="846" y="558" width="142" height="42" rx="14" fill="#1F6D53"/>
  <text x="872" y="286" fill="#131713" font-family="Arial, sans-serif" font-size="19" font-weight="700">Snapshot list</text>
  <text x="872" y="314" fill="#667065" font-family="Arial, sans-serif" font-size="18">Keep up to 10 local backups.</text>
  <text x="872" y="386" fill="#131713" font-family="Arial, sans-serif" font-size="19" font-weight="700">Restore safely</text>
  <text x="872" y="414" fill="#667065" font-family="Arial, sans-serif" font-size="18">Recover the bookmark tree from</text>
  <text x="872" y="440" fill="#667065" font-family="Arial, sans-serif" font-size="18">a selected snapshot.</text>
  <text x="872" y="486" fill="#131713" font-family="Arial, sans-serif" font-size="19" font-weight="700">Delete old entries</text>
  <text x="872" y="514" fill="#667065" font-family="Arial, sans-serif" font-size="18">Clean up history without touching</text>
  <text x="872" y="540" fill="#667065" font-family="Arial, sans-serif" font-size="18">the current bookmark structure.</text>
  <text x="881" y="585" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="700">Create backup</text>
</svg>
