  <text x="92" y="146" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">01</text>
  <text x="92" y="184" fill="#131713" font-family="Arial, sans-serif" font-size="30" font-weight="700">Snapshot</text>
  <text x="92" y="220" fill="#667065" font-family="Arial, sans-serif" font-size="18">Create a local backup</text>
  <text x="92" y="248" fill="#667065" font-family="Arial, sans-serif" font-size="18">before touching anything.</text>

  <text x="310" y="146" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">02</text>
  <text x="310" y="184" fill="#131713" font-family="Arial, sans-serif" font-size="30" font-weight="700">Scan</text>
  <text x="310" y="220" fill="#667065" font-family="Arial, sans-serif" font-size="18">Check clearly dead links</text>
  <text x="310" y="248" fill="#667065" font-family="Arial, sans-serif" font-size="18">and flag uncertain items.</text>

  <text x="528" y="146" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">03</text>
  <text x="528" y="184" fill="#131713" font-family="Arial, sans-serif" font-size="30" font-weight="700">Classify</text>
  <text x="528" y="220" fill="#667065" font-family="Arial, sans-serif" font-size="18">Send bookmark context</text>
  <text x="528" y="248" fill="#667065" font-family="Arial, sans-serif" font-size="18">to your LLM provider.</text>

  <text x="746" y="146" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">04</text>
  <text x="746" y="184" fill="#131713" font-family="Arial, sans-serif" font-size="30" font-weight="700">Plan</text>
  <text x="746" y="220" fill="#667065" font-family="Arial, sans-serif" font-size="18">Build one complete</text>
  <text x="746" y="248" fill="#667065" font-family="Arial, sans-serif" font-size="18">stable folder structure.</text>

  <text x="964" y="146" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">05</text>
  <text x="964" y="184" fill="#131713" font-family="Arial, sans-serif" font-size="30" font-weight="700">Rebuild</text>
  <text x="964" y="220" fill="#4C5A50" font-family="Arial, sans-serif" font-size="18">Rewrite the root</text>
  <text x="964" y="248" fill="#4C5A50" font-family="Arial, sans-serif" font-size="18">in a single pass.</text>

