  <rect x="278" y="116" width="196" height="168" rx="20" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="496" y="116" width="196" height="168" rx="20" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="714" y="116" width="196" height="168" rx="20" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
