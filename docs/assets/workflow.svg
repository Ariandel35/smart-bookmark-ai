  <rect x="64" y="110" width="196" height="180" rx="20" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="282" y="110" width="196" height="180" rx="20" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="500" y="110" width="196" height="180" rx="20" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <rect x="718" y="110" width="196" height="180" rx="20" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
