  <text x="88" y="150" fill="#1F6D53" font-family="Arial, sans-serif" font-size="16" font-weight="700">01</text>
  <text x="88" y="184" fill="#131713" font-family="Arial, sans-serif" font-size="24" font-weight="700">Snapshot</text>
  <text x="88" y="216" fill="#667065" font-family="Arial, sans-serif" font-size="15">Create a local backup</text>
  <text x="88" y="240" fill="#667065" font-family="Arial, sans-serif" font-size="15">before touching anything.</text>

  <text x="306" y="150" fill="#1F6D53" font-family="Arial, sans-serif" font-size="16" font-weight="700">02</text>
  <text x="306" y="184" fill="#131713" font-family="Arial, sans-serif" font-size="24" font-weight="700">Scan</text>
  <text x="306" y="216" fill="#667065" font-family="Arial, sans-serif" font-size="15">Check clearly dead links</text>
  <text x="306" y="240" fill="#667065" font-family="Arial, sans-serif" font-size="15">and flag uncertain items.</text>

  <text x="524" y="150" fill="#1F6D53" font-family="Arial, sans-serif" font-size="16" font-weight="700">03</text>
  <text x="524" y="184" fill="#131713" font-family="Arial, sans-serif" font-size="24" font-weight="700">Classify</text>
  <text x="524" y="216" fill="#667065" font-family="Arial, sans-serif" font-size="15">Send bookmark context</text>
  <text x="524" y="240" fill="#667065" font-family="Arial, sans-serif" font-size="15">to your LLM provider.</text>

  <text x="742" y="150" fill="#1F6D53" font-family="Arial, sans-serif" font-size="16" font-weight="700">04</text>
  <text x="742" y="184" fill="#131713" font-family="Arial, sans-serif" font-size="24" font-weight="700">Plan</text>
  <text x="742" y="216" fill="#667065" font-family="Arial, sans-serif" font-size="15">Build one complete</text>
  <text x="742" y="240" fill="#667065" font-family="Arial, sans-serif" font-size="15">stable structure.</text>

  <text x="960" y="150" fill="#1F6D53" font-family="Arial, sans-serif" font-size="16" font-weight="700">05</text>
  <text x="960" y="184" fill="#131713" font-family="Arial, sans-serif" font-size="24" font-weight="700">Rebuild</text>
  <text x="960" y="216" fill="#4C5A50" font-family="Arial, sans-serif" font-size="15">Rewrite the root</text>
  <text x="960" y="240" fill="#4C5A50" font-family="Arial, sans-serif" font-size="15">in a single pass.</text>

