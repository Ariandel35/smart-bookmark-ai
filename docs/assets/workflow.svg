<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="360" rx="28" fill="#FFFFFF"/>
  <rect x="30" y="30" width="1140" height="300" rx="24" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <defs>
    <filter id="shadow" x="0" y="0" width="250" height="180" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F1611" flood-opacity="0.06"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="70" y="95" width="190" height="140" rx="20" fill="#FFFFFF"/>
    <rect x="290" y="95" width="190" height="140" rx="20" fill="#FFFFFF"/>
    <rect x="510" y="95" width="190" height="140" rx="20" fill="#FFFFFF"/>
    <rect x="730" y="95" width="190" height="140" rx="20" fill="#FFFFFF"/>
    <rect x="950" y="95" width="180" height="140" rx="20" fill="#1F6D53"/>
  </g>
  <text x="125" y="130" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">01</text>
  <text x="125" y="164" fill="#131713" font-family="Arial, sans-serif" font-size="28" font-weight="700">Snapshot</text>
  <text x="125" y="194" fill="#667065" font-family="Arial, sans-serif" font-size="18">Create a local backup</text>
  <text x="125" y="220" fill="#667065" font-family="Arial, sans-serif" font-size="18">before touching anything.</text>
  <text x="345" y="130" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">02</text>
  <text x="345" y="164" fill="#131713" font-family="Arial, sans-serif" font-size="28" font-weight="700">Scan</text>
  <text x="345" y="194" fill="#667065" font-family="Arial, sans-serif" font-size="18">Check clearly dead links</text>
  <text x="345" y="220" fill="#667065" font-family="Arial, sans-serif" font-size="18">and flag uncertain items.</text>
  <text x="565" y="130" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">03</text>
  <text x="565" y="164" fill="#131713" font-family="Arial, sans-serif" font-size="28" font-weight="700">Classify</text>
  <text x="565" y="194" fill="#667065" font-family="Arial, sans-serif" font-size="18">Send bookmark context</text>
  <text x="565" y="220" fill="#667065" font-family="Arial, sans-serif" font-size="18">to your LLM provider.</text>
  <text x="785" y="130" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">04</text>
  <text x="785" y="164" fill="#131713" font-family="Arial, sans-serif" font-size="28" font-weight="700">Plan</text>
  <text x="785" y="194" fill="#667065" font-family="Arial, sans-serif" font-size="18">Build one complete,</text>
  <text x="785" y="220" fill="#667065" font-family="Arial, sans-serif" font-size="18">stable folder structure.</text>
  <text x="1000" y="130" fill="#C7F2DF" font-family="Arial, sans-serif" font-size="18" font-weight="700">05</text>
  <text x="1000" y="164" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">Rebuild</text>
  <text x="1000" y="194" fill="#EAF7F1" font-family="Arial, sans-serif" font-size="18">Rewrite the root</text>
  <text x="1000" y="220" fill="#EAF7F1" font-family="Arial, sans-serif" font-size="18">in a single pass.</text>
  <path d="M260 165H290" stroke="#C2CBC1" stroke-width="4" stroke-linecap="round"/>
  <path d="M480 165H510" stroke="#C2CBC1" stroke-width="4" stroke-linecap="round"/>
  <path d="M700 165H730" stroke="#C2CBC1" stroke-width="4" stroke-linecap="round"/>
  <path d="M920 165H950" stroke="#C2CBC1" stroke-width="4" stroke-linecap="round"/>
</svg>
