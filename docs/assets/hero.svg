<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="32" fill="#F4F5F0"/>
  <rect x="36" y="36" width="1128" height="628" rx="28" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>

  <rect x="74" y="74" width="450" height="552" rx="24" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <text x="108" y="140" fill="#1F6D53" font-family="Arial, sans-serif" font-size="20" font-weight="700">SMART BOOKMARK AI</text>
  <text x="108" y="204" fill="#131713" font-family="Arial, sans-serif" font-size="48" font-weight="700">Clean up</text>
  <text x="108" y="264" fill="#131713" font-family="Arial, sans-serif" font-size="48" font-weight="700">bookmark</text>
  <text x="108" y="324" fill="#131713" font-family="Arial, sans-serif" font-size="48" font-weight="700">libraries.</text>

  <text x="108" y="382" fill="#667065" font-family="Arial, sans-serif" font-size="20">Backup first, detect dead links,</text>
  <text x="108" y="414" fill="#667065" font-family="Arial, sans-serif" font-size="20">remove duplicates, then rebuild</text>
  <text x="108" y="446" fill="#667065" font-family="Arial, sans-serif" font-size="20">a simpler structure at root.</text>

  <rect x="108" y="482" width="186" height="54" rx="27" fill="#1F6D53"/>
  <text x="147" y="517" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="700">Chrome MV3</text>
  <rect x="312" y="482" width="180" height="54" rx="27" fill="#EBF5F0"/>
  <text x="349" y="517" fill="#1F6D53" font-family="Arial, sans-serif" font-size="23" font-weight="700">Local backup</text>

  <rect x="108" y="558" width="348" height="48" rx="16" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <text x="132" y="588" fill="#667065" font-family="Arial, sans-serif" font-size="17">Fewer folders, clearer names, safer recovery.</text>

  <rect x="560" y="74" width="566" height="170" rx="24" fill="#1F6D53"/>
  <text x="598" y="126" fill="#C7F2DF" font-family="Arial, sans-serif" font-size="18" font-weight="700">SAFETY-FIRST FLOW</text>
  <text x="598" y="178" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="33" font-weight="700">Backup → Analyze</text>
  <text x="598" y="220" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="33" font-weight="700">→ Rebuild at root</text>
  <text x="598" y="262" fill="#EAF7F1" font-family="Arial, sans-serif" font-size="19">The bookmark tree changes only after the full plan is ready.</text>

  <rect x="560" y="272" width="270" height="152" rx="24" fill="#EBF5F0" stroke="#CFE3DA" stroke-width="2"/>
  <text x="592" y="324" fill="#1F6D53" font-family="Arial, sans-serif" font-size="22" font-weight="700">Popup</text>
  <text x="592" y="360" fill="#667065" font-family="Arial, sans-serif" font-size="18">Start organize, make a</text>
  <text x="592" y="388" fill="#667065" font-family="Arial, sans-serif" font-size="18">manual backup, and review</text>
  <text x="592" y="416" fill="#667065" font-family="Arial, sans-serif" font-size="18">progress in one place.</text>

  <rect x="856" y="272" width="270" height="152" rx="24" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <text x="888" y="324" fill="#131713" font-family="Arial, sans-serif" font-size="22" font-weight="700">Settings</text>
  <text x="888" y="360" fill="#667065" font-family="Arial, sans-serif" font-size="18">Provider config, whitelist,</text>
  <text x="888" y="388" fill="#667065" font-family="Arial, sans-serif" font-size="18">automation, and restore</text>
  <text x="888" y="416" fill="#667065" font-family="Arial, sans-serif" font-size="18">from local snapshots.</text>

  <rect x="560" y="456" width="566" height="170" rx="24" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <text x="598" y="516" fill="#131713" font-family="Arial, sans-serif" font-size="30" font-weight="700">Built for real bookmark clutter</text>
  <text x="598" y="558" fill="#667065" font-family="Arial, sans-serif" font-size="19">Bring your own provider, keep keys and backups local,</text>
  <text x="598" y="588" fill="#667065" font-family="Arial, sans-serif" font-size="19">and avoid turning a long list into a folder maze.</text>
</svg>
