<svg width="1200" height="660" viewBox="0 0 1200 660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="660" rx="32" fill="#F4F5F0"/>
  <rect x="36" y="36" width="1128" height="588" rx="28" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>

  <rect x="74" y="74" width="454" height="512" rx="24" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <text x="108" y="132" fill="#1F6D53" font-family="Arial, sans-serif" font-size="20" font-weight="700">SMART BOOKMARK AI</text>
  <text x="108" y="198" fill="#131713" font-family="Arial, sans-serif" font-size="56" font-weight="700">Clean up large</text>
  <text x="108" y="260" fill="#131713" font-family="Arial, sans-serif" font-size="56" font-weight="700">bookmark libraries.</text>
  <text x="108" y="326" fill="#667065" font-family="Arial, sans-serif" font-size="24">Backup first, detect dead links, remove obvious duplicates,</text>
  <text x="108" y="362" fill="#667065" font-family="Arial, sans-serif" font-size="24">then rebuild a simpler structure at the root.</text>

  <rect x="108" y="414" width="150" height="52" rx="26" fill="#1F6D53"/>
  <text x="154" y="447" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">Chrome MV3</text>
  <rect x="274" y="414" width="168" height="52" rx="26" fill="#EBF5F0"/>
  <text x="320" y="447" fill="#1F6D53" font-family="Arial, sans-serif" font-size="22" font-weight="700">Local backup</text>

  <rect x="108" y="496" width="314" height="58" rx="18" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <text x="134" y="530" fill="#667065" font-family="Arial, sans-serif" font-size="18">Typical result: fewer folders, clearer names,</text>
  <text x="134" y="554" fill="#667065" font-family="Arial, sans-serif" font-size="18">and a safer restore path if anything goes wrong.</text>

  <rect x="562" y="74" width="562" height="162" rx="24" fill="#1F6D53"/>
  <text x="598" y="126" fill="#C7F2DF" font-family="Arial, sans-serif" font-size="18" font-weight="700">SAFETY-FIRST FLOW</text>
  <text x="598" y="182" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="40" font-weight="700">Backup → Analyze → Rebuild</text>
  <text x="598" y="216" fill="#EAF7F1" font-family="Arial, sans-serif" font-size="20">The bookmark tree is only rewritten after the full plan is ready.</text>

  <rect x="562" y="266" width="270" height="146" rx="24" fill="#EBF5F0" stroke="#CFE3DA" stroke-width="2"/>
  <text x="594" y="318" fill="#1F6D53" font-family="Arial, sans-serif" font-size="22" font-weight="700">Popup</text>
  <text x="594" y="354" fill="#667065" font-family="Arial, sans-serif" font-size="18">Organize bookmarks, create</text>
  <text x="594" y="380" fill="#667065" font-family="Arial, sans-serif" font-size="18">manual backups, and review</text>
  <text x="594" y="406" fill="#667065" font-family="Arial, sans-serif" font-size="18">progress in one place.</text>

  <rect x="854" y="266" width="270" height="146" rx="24" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <text x="886" y="318" fill="#131713" font-family="Arial, sans-serif" font-size="22" font-weight="700">Settings</text>
  <text x="886" y="354" fill="#667065" font-family="Arial, sans-serif" font-size="18">Provider config, whitelist,</text>
  <text x="886" y="380" fill="#667065" font-family="Arial, sans-serif" font-size="18">automation, and restore</text>
  <text x="886" y="406" fill="#667065" font-family="Arial, sans-serif" font-size="18">from local snapshots.</text>

  <rect x="562" y="442" width="562" height="144" rx="24" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <text x="598" y="494" fill="#131713" font-family="Arial, sans-serif" font-size="28" font-weight="700">Built for messy, real-world bookmark bars</text>
  <text x="598" y="532" fill="#667065" font-family="Arial, sans-serif" font-size="20">Use your own model provider, keep keys and backups local, and avoid</text>
  <text x="598" y="560" fill="#667065" font-family="Arial, sans-serif" font-size="20">turning a long bookmark list into a maze of over-classified folders.</text>
</svg>
