<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="32" fill="#F4F5F0"/>
  <rect x="36" y="36" width="1128" height="628" rx="28" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>

  <rect x="76" y="76" width="438" height="548" rx="24" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <text x="110" y="138" fill="#1F6D53" font-family="Arial, sans-serif" font-size="18" font-weight="700">MARKO</text>
  <text x="110" y="196" fill="#131713" font-family="Arial, sans-serif" font-size="38" font-weight="700">Clean up large</text>
  <text x="110" y="246" fill="#131713" font-family="Arial, sans-serif" font-size="38" font-weight="700">bookmark</text>
  <text x="110" y="296" fill="#131713" font-family="Arial, sans-serif" font-size="38" font-weight="700">libraries.</text>

  <text x="110" y="350" fill="#667065" font-family="Arial, sans-serif" font-size="18">Backup first, optionally check</text>
  <text x="110" y="378" fill="#667065" font-family="Arial, sans-serif" font-size="18">links in Complete mode,</text>
  <text x="110" y="406" fill="#667065" font-family="Arial, sans-serif" font-size="18">then rebuild at root.</text>

  <rect x="110" y="446" width="172" height="48" rx="24" fill="#1F6D53"/>
  <text x="149" y="477" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">Chrome MV3</text>
  <rect x="298" y="446" width="176" height="48" rx="24" fill="#EBF5F0"/>
  <text x="338" y="477" fill="#1F6D53" font-family="Arial, sans-serif" font-size="20" font-weight="700">Local backup</text>

  <rect x="110" y="534" width="328" height="44" rx="14" fill="#FFFFFF" stroke="#DFE4DB" stroke-width="2"/>
  <text x="132" y="562" fill="#667065" font-family="Arial, sans-serif" font-size="16">Fewer folders, clearer names, safer recovery.</text>

  <rect x="554" y="76" width="570" height="142" rx="24" fill="#1F6D53"/>
  <text x="592" y="122" fill="#C7F2DF" font-family="Arial, sans-serif" font-size="16" font-weight="700">SAFETY-FIRST FLOW</text>
  <text x="592" y="168" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">Backup → Analyze</text>
  <text x="592" y="204" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">→ Rebuild at root</text>

  <rect x="554" y="246" width="274" height="150" rx="22" fill="#EBF5F0" stroke="#CFE3DA" stroke-width="2"/>
  <text x="586" y="294" fill="#1F6D53" font-family="Arial, sans-serif" font-size="20" font-weight="700">Popup</text>
  <text x="586" y="326" fill="#667065" font-family="Arial, sans-serif" font-size="17">Organize bookmarks, make</text>
  <text x="586" y="352" fill="#667065" font-family="Arial, sans-serif" font-size="17">manual backups, and review</text>
  <text x="586" y="378" fill="#667065" font-family="Arial, sans-serif" font-size="17">progress in one place.</text>

  <rect x="850" y="246" width="274" height="150" rx="22" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <text x="882" y="294" fill="#131713" font-family="Arial, sans-serif" font-size="20" font-weight="700">Settings</text>
  <text x="882" y="326" fill="#667065" font-family="Arial, sans-serif" font-size="17">Provider config, whitelist,</text>
  <text x="882" y="352" fill="#667065" font-family="Arial, sans-serif" font-size="17">automation, and restore</text>
  <text x="882" y="378" fill="#667065" font-family="Arial, sans-serif" font-size="17">from local snapshots.</text>

  <rect x="554" y="426" width="570" height="164" rx="22" fill="#FAFBF7" stroke="#DFE4DB" stroke-width="2"/>
  <text x="592" y="484" fill="#131713" font-family="Arial, sans-serif" font-size="26" font-weight="700">Built for real bookmark clutter</text>
  <text x="592" y="520" fill="#667065" font-family="Arial, sans-serif" font-size="18">Use your own provider, keep backups local,</text>
  <text x="592" y="548" fill="#667065" font-family="Arial, sans-serif" font-size="18">and avoid turning a long bookmark list</text>
  <text x="592" y="576" fill="#667065" font-family="Arial, sans-serif" font-size="18">into a maze of tiny folders.</text>
</svg>
