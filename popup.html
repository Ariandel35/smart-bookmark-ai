<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="popupPageTitle">Smart Bookmark AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-body">
    <main class="popup-shell">
      <header class="topbar">
        <div class="topbar__row topbar__row--popup">
          <div>
            <div class="topbar__meta">Smart Bookmark AI</div>
            <h1 class="topbar__title" data-i18n="popupMainTitle">Bookmark Organizer</h1>
          </div>
          <div class="topbar__actions topbar__actions--popup">
            <button
              class="button button--ghost button--compact"
              id="optionsButton"
              type="button"
              data-i18n="optionsButton"
            >
              Settings
            </button>
            <span class="pill pill--warm" id="phaseBadge" data-i18n="phaseIdle">Idle</span>
          </div>
        </div>

        <div class="popup-toolbar">
          <button
            class="button button--ghost button--tiny"
            id="previewButton"
            type="button"
            data-i18n="previewButton"
          >
            Preview
          </button>
          <button
            class="button button--primary button--tiny"
            id="startButton"
            type="button"
            data-i18n="startButton"
          >
            Organize
          </button>
          <button
            class="button button--secondary button--tiny"
            id="backupButton"
            type="button"
            data-i18n="backupButton"
          >
            Backup
          </button>
          <button
            class="button button--danger button--tiny"
            id="cancelButton"
            type="button"
            data-i18n="cancelButton"
          >
            Cancel
          </button>
        </div>
      </header>

      <section class="section-stack">
        <section class="panel">
          <div class="panel__inner">
            <div class="progress-head">
              <div>
                <div class="progress-head__value" id="progressPercent">0%</div>
                <div class="progress-head__summary" id="progressSummary">0 / 0</div>
              </div>
              <div class="progress-head__meta" id="progressMeta" data-i18n="progressWaiting">Waiting to start</div>
            </div>

            <div class="progress" aria-hidden="true">
              <div class="progress__bar" id="progressBar"></div>
            </div>

            <div class="results-workspace metrics--spaced">
              <aside class="result-nav" data-i18n-aria-label="resultNavAria" aria-label="Result navigation">
                <button
                  class="result-nav__button is-active"
                  data-detail-view="overview"
                  type="button"
                >
                  <span class="result-nav__label" data-i18n="navOverview">Overview</span>
                  <span class="result-nav__value" id="totalValue">0</span>
                </button>
                <button class="result-nav__button" data-detail-view="processed" type="button">
                  <span class="result-nav__label" data-i18n="navProcessed">Processed</span>
                  <span class="result-nav__value" id="processedValue">0</span>
                </button>
                <button class="result-nav__button" data-detail-view="folders" type="button">
                  <span class="result-nav__label" data-i18n="navFolders">Categorized</span>
                  <span class="result-nav__value" id="movedValue">0</span>
                </button>
                <button class="result-nav__button" data-detail-view="deleted" type="button">
                  <span class="result-nav__label" data-i18n="navDeleted">Deleted</span>
                  <span class="result-nav__value" id="deletedValue">0</span>
                </button>
                <button class="result-nav__button" data-detail-view="warnings" type="button">
                  <span class="result-nav__label" data-i18n="navWarnings">Unprocessed</span>
                  <span class="result-nav__value" id="warningValue">0</span>
                </button>
              </aside>

              <section class="result-detail">
                <div class="detail-panel" id="detailPanel"></div>
              </section>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
