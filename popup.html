<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="popupPageTitle">Marko</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-body">
    <main class="popup-shell">
      <header class="topbar">
        <div class="topbar__row topbar__row--popup">
          <div>
            <h1 class="topbar__title" data-i18n="popupMainTitle">Marko</h1>
          </div>
          <div class="topbar__actions topbar__actions--popup">
            <button
              class="button button--ghost button--compact"
              id="optionsButton"
              type="button"
              data-i18n="optionsButton"
            >
              Settings
            </button>
            <span
              class="pill pill--warm"
              id="phaseBadge"
              role="status"
              aria-live="polite"
              aria-atomic="true"
              data-i18n="phaseIdle"
            >
              Idle
            </span>
          </div>
        </div>
      </header>

      <section class="popup-toolbar">
        <button
          class="button button--primary button--tiny"
          id="startButton"
          type="button"
          aria-describedby="popupActionStatus"
          data-i18n="previewButton"
        >
          Preview
        </button>
        <button
          class="button button--secondary button--tiny"
          id="backupButton"
          type="button"
          aria-describedby="popupActionStatus"
          data-i18n="backupButton"
        >
          Backup
        </button>
        <button
          class="button button--danger button--tiny"
          id="cancelButton"
          type="button"
          aria-describedby="popupActionStatus"
          data-i18n="cancelButton"
        >
          Cancel
        </button>
      </section>

      <section class="popup-mode-bar" aria-labelledby="popupSpeedModeLabel">
        <span class="popup-mode-bar__label" id="popupSpeedModeLabel" data-i18n="popupSpeedModeLabel">Mode</span>
        <div class="segmented-control" role="radiogroup" aria-labelledby="popupSpeedModeLabel">
          <button
            class="segmented-control__button"
            id="speedModeFastButton"
            type="button"
            role="radio"
            data-popup-speed-mode="fast"
            aria-checked="true"
            data-i18n="linkCheckFast"
          >
            Fast
          </button>
          <button
            class="segmented-control__button"
            id="speedModeBalancedButton"
            type="button"
            role="radio"
            data-popup-speed-mode="balanced"
            aria-checked="false"
            data-i18n="linkCheckBalanced"
          >
            Balanced
          </button>
          <button
            class="segmented-control__button"
            id="speedModeCompleteButton"
            type="button"
            role="radio"
            data-popup-speed-mode="complete"
            aria-checked="false"
            data-i18n="linkCheckComplete"
          >
            Complete
          </button>
        </div>
      </section>

      <div class="popup-action-status status-text" id="popupActionStatus" role="status" aria-live="polite" hidden></div>

      <section class="section-block">
        <div class="progress-head">
          <div>
            <div class="progress-head__value" id="progressPercent">0%</div>
            <div class="progress-head__summary" id="progressSummary">0 / 0</div>
          </div>
          <div class="progress-head__meta" id="progressMeta" data-i18n="progressWaiting">Waiting to start</div>
        </div>

        <div
          class="progress"
          id="progressTrack"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-valuetext="0%"
          aria-describedby="progressSummary progressMeta"
          data-i18n-aria-label="progressAriaLabel"
          aria-label="Organize progress"
        >
          <div class="progress__bar" id="progressBar"></div>
        </div>

        <div class="stat-strip">
          <div class="stat-inline">
            <span class="stat-inline__label" data-i18n="statTotal">Total</span>
            <strong class="stat-inline__value" id="totalValue">0</strong>
          </div>
          <div class="stat-inline">
            <span class="stat-inline__label" data-i18n="statMoved">Categorized</span>
            <strong class="stat-inline__value" id="movedValue">0</strong>
          </div>
          <div class="stat-inline">
            <span class="stat-inline__label" data-i18n="statDeleted">Deleted</span>
            <strong class="stat-inline__value" id="deletedValue">0</strong>
          </div>
          <div class="stat-inline">
            <span class="stat-inline__label" data-i18n="statWarnings">Needs review</span>
            <strong class="stat-inline__value" id="warningValue">0</strong>
          </div>
        </div>
      </section>

      <section class="section-block section-block--detail">
        <div
          class="detail-panel"
          id="detailPanel"
          role="region"
          data-i18n-aria-label="detailPanelAriaLabel"
          aria-label="Status details"
        ></div>
      </section>
    </main>

    <script src="i18n.js"></script>
    <script src="providers.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
